[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mgjstyle"
version = "0.1.0"
description = "Mario González-Jiménez's matplotlib colour palette and figure style"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mario González-Jiménez", email = "magonji@gmail.com" }]
keywords = ["matplotlib", "colour palette", "figure style", "spectroscopy"]
classifiers = [
    "Framework :: Matplotlib",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["matplotlib>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=7", "numpy"]

[project.urls]
Homepage = "https://github.com/magonji/mgjstyle"
Issues = "https://github.com/magonji/mgjstyle/issues"

[tool.setuptools.packages.find]
include = ["mgjstyle*"]

[tool.setuptools.package-data]
mgjstyle = ["*.mplstyle", "py.typed"]
